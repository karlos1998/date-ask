name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'karlos1998/date-ask' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build and pack image
        run: |
          docker build -t date-ask:${{ github.sha }} .
          mkdir -p artifact
          docker save date-ask:${{ github.sha }} | gzip -1 > artifact/images.tar.gz
          printf '%s\n' '${{ github.sha }}' > artifact/TAG
          cp docker-compose.production.yml deploy/activate.sh artifact/
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$SERVER_USER@$SERVER_HOST"
          staging="/opt/apps/date-ask/releases/${{ github.sha }}"
          ssh -i ~/.ssh/deploy_key "$target" "mkdir -p '$staging'"
          scp -i ~/.ssh/deploy_key artifact/* "$target:$staging/"
          ssh -i ~/.ssh/deploy_key "$target" "bash '$staging/activate.sh' '$staging'"
      - name: Verify public endpoint
        run: curl --fail --location --max-redirs 5 --max-time 20 --retry 12 --retry-delay 10 --retry-all-errors https://date-ask.letscode.it/ -o /dev/null
